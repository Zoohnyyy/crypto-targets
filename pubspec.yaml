name: crypto_prices
description: "Real-time cryptocurrency prices with a home screen widget and price alerts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Real-time streaming from Binance
  web_socket_channel: ^3.0.3
  # REST calls (fetch coin list, fallback snapshots, widget background refresh)
  http: ^1.6.0
  # Local persistence for the user's watchlist and alerts
  shared_preferences: ^2.5.5
  # Home screen widget bridge
  home_widget: ^0.9.3
  # Local notifications for price alerts
  flutter_local_notifications: ^22.1.0
  # Firebase Cloud Messaging for instant push notifications from the backend
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  # Timezone data required by flutter_local_notifications scheduling
  timezone: ^0.11.1
  # Background periodic work (widget refresh + alert checks)
  workmanager: ^0.9.0+3
  # Simple state management
  provider: ^6.1.2
  # Number/currency formatting
  intl: ^0.20.2
  # Cached network images for token logos
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
